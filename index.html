
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE SYNAPTIC LEDGER | Intelligence Reimagined</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif', 'system-ui'],
            },
            animation: {
              'mesh-slow': 'mesh 25s ease infinite',
              'float': 'float 6s ease-in-out infinite',
              'pulse-soft': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              mesh: {
                '0%, 100%': { transform: 'translate(0, 0) scale(1) rotate(0deg)' },
                '33%': { transform: 'translate(10%, -10%) scale(1.2) rotate(5deg)' },
                '66%': { transform: 'translate(-10%, 10%) scale(0.8) rotate(-5deg)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              }
            }
          },
        },
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        html, body, #root {
          height: 100%;
          margin: 0;
          padding: 0;
        }
        body { 
          transition: background-color 0.5s ease; 
          overflow-x: hidden;
          background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2000&auto=format&fit=crop');
          background-size: cover;
          background-position: center;
          background-attachment: fixed;
        }
        .bg-overlay {
          position: fixed;
          inset: 0;
          background: rgba(248, 250, 252, 0.85);
          z-index: -2;
          transition: background 0.5s ease;
        }
        .dark .bg-overlay {
          background: rgba(2, 6, 23, 0.85);
        }
        .mesh-bg {
          position: fixed;
          top: -60%;
          left: -60%;
          width: 220%;
          height: 220%;
          z-index: -1;
          filter: blur(100px);
          opacity: 0.5;
          background: 
            radial-gradient(circle at 50% 50%, #6366f1 0%, transparent 40%),
            radial-gradient(circle at 80% 20%, #8b5cf6 0%, transparent 40%),
            radial-gradient(circle at 20% 80%, #06b6d4 0%, transparent 40%),
            radial-gradient(circle at 90% 90%, #ec4899 0%, transparent 40%),
            radial-gradient(circle at 10% 10%, #f59e0b 0%, transparent 40%);
        }
        .dark .mesh-bg {
          opacity: 0.2;
          background: 
            radial-gradient(circle at 50% 50%, #4338ca 0%, transparent 40%),
            radial-gradient(circle at 80% 20%, #6d28d9 0%, transparent 40%),
            radial-gradient(circle at 20% 80%, #0e7490 0%, transparent 40%);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #6366f133; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f166; }
        .mermaid svg { max-width: 100% !important; height: auto !important; }
        .glass-panel {
          background: rgba(255, 255, 255, 0.7);
          backdrop-filter: blur(16px);
          border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-panel {
          background: rgba(15, 23, 42, 0.7);
          backdrop-filter: blur(16px);
          border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-transparent text-slate-900 dark:text-slate-100">
    <div class="bg-overlay"></div>
    <div class="mesh-bg animate-mesh-slow"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
